<style>

}

.note{margin:0;text-align:center;color:var(--mu);font-size:14px;text-wrap:pretty}

.box{position:relative;margin:auto;background:var(--c1);color:var(--tx);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));width:min(480px,100%);max-height:min(86dvh,760px);overflow:auto;overscroll-behavior:contain;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:8px;row-gap:12px}

function chipTone(v){

const pay=(p,n)=>{n=Math.max(0,Math.min(n,p.stack));p.stack-=n;p.bet+=n;p.in=(p.in||0)+n;S.pot+=n;p.ok=1};

function logEv(e){if(!Array.isArray(S.log))S.log=[];S.log.push(e);if(S.log.length>500)S.log.splice(0,S.log.length-500)}

function logLine(e,full){
 if(!e)return '';
 const nm=s=>String(s==null?'':s).replace(/\s+/g,' ').trim();
 if(e.t==='hand'){
  const won=(e.won||[]).map(w=>nm(w.name)+' '+w.n).join(', ')||'none';

  if(full&&e.pl)s+='\n'+e.pl.map(p=>nm(p.name)+' '+p.b+' -> '+p.a).join('\n');

 }
 if(e.t==='bust')return 'Bust '+nm(e.name);
 if(e.t==='rebuy')return 'Rebuy '+nm(e.name)+' '+e.n;
 if(e.t==='ko')return 'Knockout bonus '+nm(e.name)+' '+e.n;
 if(e.t==='stack')return 'Stack '+nm(e.name)+' '+e.old+' -> '+e.n;

function logText(){return (S.log||[]).slice().reverse().map(e=>logLine(e,true)).join('\n\n')}

function nxt(from){const n=S.pl.length;for(let i=1;i<=n;i++){const p=S.pl[(from+i)%n];if(!p.fold&&p.stack>0)return p.id}return null}

/* Dealt-in = still seated with chips and not sitting out. S.bbi (BB id) is the source of truth; S.dl is the BTN index. */
function inSeat(p){return !!(p&&p.stack>0&&!p.fold)}
function chipIn(p){return !!(p&&(p.stack+(p.in||0))>0&&!p.fold)}
function saveReg(raw){
 const nm=String(raw||'').trim().slice(0,16);
 if(!nm||!Array.isArray(S.regs))return;
 if(S.regs.some(r=>String(r.name).toLowerCase()===nm.toLowerCase()))return;

}
const rkey=s=>String(s||'').trim().toLowerCase();
function winPct(r){const g=r.games|0;return g?Math.round(100*(r.wins|0)/g)+'%':'-'}
/* One result per game. rec is cleared by New Game and Reset. */
function saveResult(){
 if(S.rec||S.pot||(S.q&&S.q.length)||!(S.hand>1))return;
 const alive=S.pl.filter(p=>p.stack>0);

 S.pl.forEach(p=>{const r=S.regs.find(g=>rkey(g.name)===rkey(p.name));if(r)r.games=(r.games|0)+1});

}
function seatNamed(raw){
 const id=S.nid++;
 const nm=String(raw||'').trim().slice(0,16)||('Player '+id);

function assignFromBTN(idx){
 const n=S.pl.length;
 if(n<2)return false;

 for(let i=1;i<=n;i++){const p=S.pl[(idx+i)%n];if(inSeat(p))seats.push(p)}

}
function assignFromBB(id){
 const n=S.pl.length,bb=S.pl.find(p=>p.id===id);
 if(!bb||!inSeat(bb)||n<2)return false;

 if(seats.length<2)return false;

 if(seats.length===2){
  const other=seats.find(p=>p!==bb);

/* Between hands, recompute SB/BB from the current BTN so a new or broke seat is picked up. */
function seatBtn(){
 const prev=btnId();
 if(S.pot||(S.q&&S.q.length))return;

 if(n<2){S.bbi=0;S.sbi=0;S.bba=-1;if(n<1)S.dl=0;noteBtn(prev);return}

 if(!inSeat(S.pl[idx])){for(let i=1;i<=n;i++){const j=(idx+i)%n;if(inSeat(S.pl[j])){idx=j;break}}}

function post(){
 const sb=S.pl.find(p=>p.id===S.sbi),bb=S.pl.find(p=>p.id===S.bbi);
 if(!sb||!bb)return;

function moveBtn(id){

function advance(){

function boot(){
 if(!Array.isArray(S.pl))S.pl=[];

  if(S.li>=S.lv.length)S.li=S.lv.length-1;

 if(!S.pl.length){S.dl=0;return}

 S.dl=((S.dl|0)%n+n)%n;

 if(!S.pl.some(p=>p.id===S.bbi)){
  const seats=[];
  for(let i=1;i<=n;i++){const p=S.pl[(S.dl+i)%n];if(pred(p))seats.push(p)}
  if(seats.length>=2){
   const hu=seats.length===2,bb=hu?seats[0]:seats[1],sb=hu?seats[1]:seats[0];
   S.bbi=bb.id;S.sbi=sb.id;
   if(hu)S.dl=S.pl.indexOf(sb);
   else if(!pred(S.pl[S.dl])){

    for(let i=1;i<=n;i++){const p=S.pl[(si-i+n*n)%n];if(pred(p)){S.dl=S.pl.indexOf(p);break}}
   }
  }
 }
 if(S.pot&&!S.orh){
  const m=S.pl.filter(pred).length;
  if(m>=2){if(!S.orn)S.orn=m;S.orh=1}

}

/* Blinds: lv is the level list. A saved game with no lv keeps the generated ladder. */
const nb=()=>LAD.find(x=>x>S.bb)||Math.ceil(S.bb*.75)*2;
const cleanBb=n=>{const step=n<1000?50:n<10000?100:500;return Math.round(n/step)*step};
const hasLv=()=>Array.isArray(S.lv)&&S.lv.length>0;
const onLast=()=>hasLv()&&S.li>=S.lv.length-1;
const tplFor=n=>{n=n|0;if(n<5)n=5;else if(n>10)n=10;return TPL[n]};
function applyTpl(n,quiet){
 const t=tplFor(n);
 const prev={sb:S.sb|0,bb:S.bb|0,lvl:S.lvl|0};
 S.start=t.start;S.hpl=t.hpl;S.lv=t.lv.map(p=>[p[0],p[1]]);
 S.li=0;S.sb=S.lv[0][0];S.bb=S.lv[0][1];S.lvl=1;S.hl=0;S.up=0;
 let moved=false;
 S.pl.forEach(p=>{if((p.stack|0)!==S.start)moved=true;setStack(p,S.start);if(!S.pot){p.bet=0;p.in=0;p.ok=0;p.fold=0}});
 noteBlind(prev);
 if(!quiet&&moved)logEv({t:'reset',tpl:1});
}
function maybeFit(){if(S.custom||S.hand!==1||S.pot)return;applyTpl(S.pl.length)}
function resetTpl(){
 const n=S.pl.length,use=n<5?5:n>10?10:n;
 if((S.hand>1||S.pot>0)&&!confirm('A hand has been played. Reset stacks and blinds to the '+use+'-player template?'))return false;
 run(()=>{applyTpl(n,true);S.custom=false;if(!S.pot)seatBtn();logEv({t:'reset',tpl:1})});
 return true;
}
const lvlUp=()=>{
 const prev={sb:S.sb|0,bb:S.bb|0,lvl:S.lvl|0};
 if(hasLv()){
  if(S.li<S.lv.length-1){S.li++;S.sb=S.lv[S.li][0];S.bb=S.lv[S.li][1];S.lvl=S.li+1;S.hl=0;S.up=1}
  else S.pend=true;
  noteBlind(prev);
  return;
 }
 const b=nb();S.sb=b/2;S.bb=b;S.lvl++;S.hl=0;S.up=1;
 noteBlind(prev);
};
/* Start a hand: post the blinds. rot places BB, SB and BTN once rebuys and Next Blinds are answered, from whoever still has chips. First to act = next dealt-in player after the BB. Orbit length is fixed at the first hand of the orbit. */
const ready=()=>S.pl.filter(p=>p.stack>0).length>1;
function deal(){
 if(S.pend)return;
 const prev=btnId();
 if(S.rot){S.rot=0;advance()}
 const n=S.pl.length;
 if(n<2){noteBtn(prev);return}
 const bb=S.pl.find(p=>p.id===S.bbi),sb=S.pl.find(p=>p.id===S.sbi);
 if(!inSeat(bb)||!inSeat(sb)){
  let idx=(S.dl%n+n)%n;
  if(!inSeat(S.pl[idx])){for(let i=1;i<=n;i++){const j=(idx+i)%n;if(inSeat(S.pl[j])){idx=j;break}}}
  if(!assignFromBTN(idx)){noteBtn(prev);return}
 }
 if(S.pl.filter(inSeat).length<2){noteBtn(prev);return}
 if(!S.orn){S.orn=S.pl.filter(inSeat).length;S.orh=0}
 S.orh++;

}

/* Side pots from each player's total chips in this hand (p.in); folded chips are dead money */
function pots(){
 const A=S.pl.filter(p=>p.in>0),L=[...new Set(A.filter(p=>!p.fold).map(p=>p.in))].sort((a,b)=>a-b),R=[];let v=0;
 L.forEach(l=>{R.push({amt:A.reduce((s,p)=>s+Math.max(0,Math.min(p.in,l)-v),0),el:A.filter(p=>!p.fold&&p.in>=l).map(p=>p.id)});v=l});
 const rest=A.reduce((s,p)=>s+Math.max(0,p.in-v),0);if(rest&&R.length)R[R.length-1].amt+=rest;
 return R.reduce((s,r)=>s+r.amt,0)===S.pot?R:S.pot?[{amt:S.pot,el:live().map(p=>p.id)}]:[]}

/* End of hand: pay winners. The next blinds are placed in deal(), after rebuys. A new orbit starts every N hands. */
function fin(A){const handNo=S.hand,potWas=S.pot|0,before=S.pl.map(p=>({id:p.id,name:p.name,b:p.stack|0})),win=new Set(),got=new Map();A.forEach(({amt,ids})=>{const w=S.pl.filter(p=>ids.includes(p.id));if(!w.length)return;const q=Math.floor(amt/w.length);w.forEach(p=>{p.stack+=q;win.add(p.id);got.set(p.id,(got.get(p.id)||0)+q)});const odd=amt-q*w.length;w[0].stack+=odd;if(odd)got.set(w[0].id,(got.get(w[0].id)||0)+odd)});logEv({t:'hand',h:handNo,pot:potWas,won:[...got.entries()].filter(([,n])=>n).map(([id,n])=>{const p=byId(id);return {id,name:p?p.name:'',n}}),pl:before.map(r=>{const p=S.pl.find(x=>x.id===r.id);return {id:r.id,name:r.name,b:r.b,a:p?p.stack|0:r.b}})});
 const bu=S.pl.filter(p=>p.in>0&&p.stack<=0).map(p=>p.id);
 S.pot=0;S.hand++;S.st=0;S.add=0;S.sel=null;S.up=0;
 S.pl.forEach(p=>{p.bet=0;p.in=0;p.ok=0;p.fold=p.stack<=0?1:0});
 S.rot=1;
 if(S.orn&&S.orh>=S.orn){S.orb++;S.orn=0;S.orh=0}
 S.q=bu;S.kw=[...win];
 if(++S.hl>=S.hpl)lvlUp();if(!S.q.length)deal()}

/* A betting round is over when every player who can still act has acted and matched the highest bet */
const canAct=()=>live().filter(p=>p.stack>0);
function done(){const a=canAct(),h=hi();return a.every(p=>p.bet===h&&(p.ok||a.length<2))}
/* After each action: next player, or close the round (next street / showdown). Returns 1 at showdown. */
function step(p){
 const l=live();
 if(l.length===1){fin([{amt:S.pot,ids:[l[0].id]}]);return 0}
 if(!done()){S.sel=nxt(S.pl.indexOf(p));return 0}
 do{if(S.st===3){S.sel=null;return 1}S.st++;S.add=0;S.pl.forEach(q=>{q.bet=0;q.ok=0})}while(canAct().length<2);
 S.sel=nxt(S.dl);return 0}
function act(a,amt=S.add){const p=cur();if(!p||p.fold)return;const c=Math.max(0,hi()-p.bet);
 if(a==='check'&&c>0)return alert('Check isn’t available: '+f(c)+' to call. Tap Call, Raise or Fold.');
 if(a==='raise'&&amt<=0)return;
 let sd=0;
 run(()=>{
  if(a==='fold')p.fold=1;
  if(a==='check')p.ok=1;
  if(a==='call')pay(p,c);
  if(a==='allin')pay(p,p.stack);
  if(a==='raise'){pay(p,c+amt);S.add=0}
  sd=step(p)});
 if(sd)award()}

/* Chip-set fit: size the starting stack and first blinds so the whole set is in play (stack = depth x BB) */
const plan=(n,tot,rb,bbs)=>{const bb=Math.max(2,Math.floor(tot/(n*(1+rb)*bbs))),st=bb*bbs;return{bb,sb:Math.floor(bb/2),st,used:st*n*(1+rb)}};
function newGame(){

 };

 },'<div id="pv" aria-live="polite"></div><button data-fit>Fit to My Chip Set</button>',d=>{

function addDlg(){
 const saved=S.regs.filter(r=>r&&r.name&&!S.pl.some(p=>p.name.toLowerCase()===r.name.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name,'en',{sensitivity:'base'}));
 const full=S.regs.length>=30;
 const chips=saved.length?`<p class="bt">Saved names</p><div class="chips">`+saved.map((r,i)=>`<button data-i="${i}">${esc(r.name)}</button>`).join('')+`</div>`:'';
 ask('Add Player',[['Name','name','Player '+S.nid]],v=>{
  if(S.pl.length>=10)return bad('10 players max.');
  const box=$('ov').querySelector('[name="rem"]');
  run(()=>{const nm=seatNamed(v.name);if(box&&box.checked)saveReg(nm);seatBtn()});
 },`<label class="ck"><input type="checkbox" name="rem"${full?' disabled':' checked'}> Remember this name${full?' (list full)':''}</label>`+chips,d=>{
  if(!('i' in d)||S.pl.length>=10)return;
  const r=saved[+d.i];if(!r)return;
  run(()=>{seatNamed(r.name);seatBtn()});off();
 });
}
$('add').onclick=addDlg;
$('undo').onclick=()=>{if(U.length){S=JSON.parse(U.pop());save();draw()}};
$('award').onclick=award;
$('bl').onclick=()=>{
 const nx=onLast()?null:hasLv()?S.lv[S.li+1]:[nb()/2,nb()];
 ask('Blinds',[['Small Blind (SB)','sb',S.sb,1],['Big Blind (BB)','bb',S.bb,1],['Hands Per Level','hpl',S.hpl,1]],v=>{
 const sb=+v.sb,bb=+v.bb,h=+v.hpl;
 if(!(Number.isInteger(sb)&&Number.isInteger(bb)&&Number.isInteger(h)&&sb>0&&bb>=sb&&h>=1))return bad('Use whole numbers: Small Blind up to Big Blind, and at least 1 hand per level.');
 run(()=>{const prev={sb:S.sb|0,bb:S.bb|0,lvl:S.lvl|0};S.sb=sb;S.bb=bb;S.hpl=h;S.up=0;S.custom=true;if(hasLv())S.lv[S.li]=[sb,bb];noteBlind(prev)})},
 `<p class="bt">Level ${S.lvl} · ${S.hl} of ${S.hpl} hands played.${nx?' Next level: '+f(nx[0])+'/'+f(nx[1])+'.':''}</p><button data-nl>Next Level Now</button>`,
 d=>{if('nl' in d){off();run(lvlUp)}});};
function lvlDlg(){
 let rows=(hasLv()?S.lv:[[S.sb|0,S.bb|0]]).map(p=>[p[0],p[1]]),li=hasLv()?S.li|0:0;
 const grab=()=>{const root=$('ov');rows.forEach((p,i)=>{if(i<li)return;const a=root.querySelector('[name="sb'+i+'"]'),b=root.querySelector('[name="bb'+i+'"]');if(a)p[0]=a.value;if(b)p[1]=b.value})};
 const paint=()=>ov(`<h2 id="t">Blind Levels</h2>`+rows.map((p,i)=>{const ro=i<li;return `<div class="lvr${i===li?' now':''}"><span class="lvn">${i+1}${i===li?' · Now':''}</span><label>SB<input name="sb${i}" value="${esc(p[0])}" inputmode="numeric" pattern="[0-9]*" autocomplete="off"${ro?' disabled':''}></label><label>BB<input name="bb${i}" value="${esc(p[1])}" inputmode="numeric" pattern="[0-9]*" autocomplete="off"${ro?' disabled':''}></label>${i>li?`<button data-rm="${i}" aria-label="Remove level ${i+1}">Remove</button>`:''}</div>`}).join('')+`<div class="row"><button data-add>Add Level</button><button data-t>Reset to Template</button></div><div class="row"><button data-x>Cancel</button><button class="go" data-ok style="min-height:48px">Save</button></div>`,d=>{
  if('x' in d)return off();
  if('add' in d){grab();if(rows.length>=30)return bad('30 levels max.');const last=rows[rows.length-1];rows.push([last[0],last[1]]);paint();return}
  if('rm' in d){grab();const i=+d.rm;if(i>li&&i<rows.length)rows.splice(i,1);paint();return}
  if('t' in d){if(!resetTpl())return;rows=S.lv.map(p=>[p[0],p[1]]);li=S.li;paint();return}
  if('ok' in d){
   grab();
   const next=rows.map(p=>[String(p[0]).trim(),String(p[1]).trim()]);
   if(next.some(p=>!/^\d+$/.test(p[0])||!/^\d+$/.test(p[1])||+p[0]<=0||+p[1]<+p[0]))return bad('Each level needs a whole-number small blind and a big blind at least that big.');
   const lv=next.map(p=>[+p[0],+p[1]]);
   run(()=>{const prev={sb:S.sb|0,bb:S.bb|0,lvl:S.lvl|0};S.lv=lv;S.li=li;S.sb=lv[li][0];S.bb=lv[li][1];S.lvl=li+1;S.custom=true;S.up=0;noteBlind(prev)});
   off()}});
 paint()}
$('cfg').onclick=()=>{ov(`<h2 id="t">Setup</h2>${themePicker()}<button data-a="n">New Game</button><button data-a="ck">Chip Check<b>${chipMsg()}</b></button><button data-a="lg">Audit Log<b>${(S.log&&S.log.length)||0}</b></button><button data-a="p">Regular Players<b>${S.regs.length||'None'}</b></button><button data-a="s">Starting Stack<b>${f(S.start)}</b></button><button data-a="lv">Blind Levels</button><button data-a="t">Reset to Template</button><button data-a="c">Chip Buttons<b>${S.chips.join(', ')}</b></button><button data-a="g">Special Games<b>${S.sp.length||'None'}</b></button><button class="fold" data-a="r">Reset Game</button><button data-x>Close</button>`,d=>{
 off();
 if(d.a==='n')newGame();
 if(d.a==='ck')chipDlg();
 if(d.a==='lg')auditDlg(-1);
 if(d.a==='p')regsDlg();
 if(d.a==='lv')lvlDlg();
 if(d.a==='t')resetTpl();
 if(d.a==='g')ask('Special Games',[['Games in rotation, comma separated (one per orbit)','g',S.sp.join(', ')]],v=>{const a=v.g.split(',').map(x=>x.trim()).filter(Boolean).slice(0,8);run(()=>{S.sp=a;S.orb=0})});
 if(d.a==='s')ask('Starting Stack',[['Chips for new players','n',S.start,1]],v=>+v.n>0&&/^\d+$/.test(v.n)?run(()=>{S.start=+v.n;S.custom=true}):bad('Enter a whole number above 0.'));
 if(d.a==='c')ask('Chip Buttons',[['Values, comma separated (max 6)','c',S.chips.join(', ')]],v=>{const a=v.c.split(',').map(x=>parseInt(x,10)).filter(x=>x>0).slice(0,6);return a.length?run(()=>{S.chips=a}):bad('Enter numbers like 10, 25, 100.')});
 if(d.a==='r'&&confirm('Reset all players, stacks, blinds and the pot? Undo can bring them back.'))run(()=>{const k={},keep=Array.isArray(S.log)?S.log.slice(-499):[];['start','chips','hpl','total','maxRb','bbs','kop','sp','regs'].forEach(x=>{k[x]=S[x]});S={...def(),...k,log:keep,issued:0};logEv({t:'reset'})})});
 $('ov').onchange=e=>{if(e.target&&e.target.name==='theme')setTheme(e.target.value)}}

$('grid').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.o)opt(+b.dataset.o);else if(b.dataset.id){S.sel=+b.dataset.id;S.add=0;save();draw()}};
$('bar').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,c=cur();
 if(d.b==='start')return run(deal);
 if(d.b==='save'){if(!S.rec)run(saveResult);return}
 if(!c)return;
 if(d.v!==undefined){const m=Math.max(0,c.stack-Math.max(0,hi()-c.bet));S.add=d.v==='0'?0:Math.min(S.add+Number(d.v),m);save();draw()}
 else if(d.s)sz(+d.s);
 else if(d.b==='custom')custom();
 else if(d.b)act(d.b)};
$('dlb').onclick=()=>{
 if(!canPick())return;
 const n=S.pl.length,curId=n?S.pl[(S.dl%n+n)%n].id:0;
 const ps=S.pl.filter(chipIn);
 ov(`<h2 id="t">Button</h2><div class="chips">`+ps.map(p=>`<button data-id="${p.id}" class="${p.id===curId?'go':''}" aria-pressed="${p.id===curId}">${esc(p.name)}</button>`).join('')+`</div><button data-x>Close</button>`,d=>{
  if('x' in d||d.id===undefined)return off();
  const id=+d.id;off();run(()=>moveBtn(id));
 });
};

function chipDlg(){
 const exp=S.issued|0,on=onTable();
 ov(`<h2 id="t">Chip Check</h2><p>Expected <b>${f(exp)}</b></p><p>On table <b>${f(on)}</b></p><p><b>${esc(chipMsg())}</b></p><button type="button" data-x>Close</button>`,d=>{if('x' in d)off()});
}
function auditDlg(open){
 const items=(S.log||[]).map((e,i)=>({e,i})).reverse();
 const body=items.map(({e,i})=>{
  if(e.t!=='hand')return `<p class="bt">${esc(logLine(e))}</p>`;
  const on=open===i;
  const detail=on?`<div class="bt">`+(e.pl||[]).map(p=>`${esc(p.name)} ${f(p.b)} → ${f(p.a)}`).join('<br>')+`</div>`:'';
  const won=(e.won||[]).map(w=>esc(w.name)+' '+f(w.n)).join(', ');
  return `<button type="button" data-i="${i}" aria-expanded="${on}">Hand ${e.h} · pot ${f(e.pot)}${won?' · '+won:''}</button>${detail}`;
 }).join('');
 ov(`<h2 id="t">Audit Log</h2><button type="button" class="go" data-a="copy">Copy Log</button>${body||'<p class="bt">No entries yet.</p>'}<button type="button" data-x>Close</button>`,d=>{
  if(d.a==='copy'){copyLog();return}
  if(d.i!==undefined){auditDlg(open===+d.i?-1:+d.i);return}
  if('x' in d)off();
 });
}
function draw(){
 if(S.q.length&&$('ov').hidden)bust();
 else if(S.pend&&$('ov').hidden)nextBlinds();
 const gap=chipOff(),chk=$('chk');
 if(chk){if(gap){chk.hidden=false;chk.textContent='Chip check off by '+f(Math.abs(gap))+', see Audit Log'}else chk.hidden=true}
 const n=S.pl.length,t=hi(),c=cur(),R=pots(),wide=matchMedia('(min-width:900px)').matches;
 $('pot').textContent=f(S.pot);
 $('info').textContent=wide?'Pot':'Hand '+S.hand+' · '+SN[S.st]+' · '+n+'/10';
 const ct=$('count');if(ct)ct.textContent=n+'/10 players';
 const live=$('live'),msg='Hand '+S.hand+', '+SN[S.st]+', '+n+' players, pot '+f(S.pot)+(S.up?', blinds up':'');
 if(live&&live.textContent!==msg)live.textContent=msg;
 $('add').disabled=n>=10;$('add').classList.toggle('go',!n);$('undo').disabled=!U.length;
 $('award').disabled=!S.pot;$('award').textContent=R.length>1?'Side Pots · Award':'Award Pot';
 $('bl').innerHTML='<span class="bl-l">'+(S.up?ICO.up:'')+'<span>'+(S.up?'Blinds up':'Blinds')+'</span></span><span class="bl-n">'+f(S.sb)+' / '+f(S.bb)+'</span><span class="bl-s">Level '+S.lvl+' · Hand '+Math.min(S.hl+1,S.hpl)+'/'+S.hpl+'</span>';
 $('bl').classList.toggle('up',!!S.up);
 const street=$('street');
 if(street)street.querySelectorAll('[data-i]').forEach(el=>{const on=+el.dataset.i===S.st;el.classList.toggle('now',on);if(on)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current')});
 const di=n?((S.dl%n)+n)%n:-1,showB=canPick(),bp=di>=0?S.pl[di]:null;
 $('dlb').hidden=!showB;if(showB)$('dlb').textContent='Button: '+(bp?bp.name:'');
 const sp=S.sp.length&&S.pot&&S.orh===1?S.sp[((S.orb%S.sp.length)+S.sp.length)%S.sp.length]:'';$('sp').hidden=!sp;if($('spt'))$('spt').textContent=sp?'Special game this orbit: '+sp:'';
 $('grid').innerHTML=n?S.pl.map((p,i)=>{
  const kind=p.fold?(p.stack<=0&&!p.in?'bust':'fold'):p.stack<=0?'allin':p.bet?'bet':p.ok?'check':'';
  const label=kind==='bust'?'Bust':kind==='fold'?'Folded':kind==='allin'?'All-In':kind==='bet'?'Bet '+f(p.bet):kind==='check'?'Checked':'';
  const pill=label?`<span class="pill${kind==='bust'||kind==='fold'?' bad':kind==='allin'?' warn':''}">${label}</span>`:'';
  const act=p.id===S.sel&&!p.fold&&p.stack>0&&S.pot;
  const marks=(i===di?'<span class="bdg d" role="img" aria-label="Dealer">D</span>':'')+(S.sbi&&p.id===S.sbi?'<span class="bdg sb" role="img" aria-label="Small blind">SB</span>':'')+(S.bbi&&p.id===S.bbi?'<span class="bdg bb" role="img" aria-label="Big blind">BB</span>':'');
  return `<div class="p${p.id===S.sel?' sel':''}${p.fold?' f':''}"><button type="button" class="pick" data-id="${p.id}" aria-pressed="${p.id===S.sel}"><span class="av h${avHue(p.name)}" aria-hidden="true">${initial(p.name)}</span><span class="pc"><span class="nm"><span class="nx">${esc(p.name)}</span>${marks}${act?'<span class="pill act">To act</span>':''}</span><span class="st">${f(p.stack)}</span><span class="sub"><span class="bb">${bbv(p.stack)}</span>${pill}</span>${meta(p)}</span></button><button type="button" class="mo" data-o="${p.id}" aria-label="Options for ${esc(p.name)}">${ICO.more}</button></div>`}).join(''):'<div class="empty"><h2>Start a Home Game</h2><p class="lead">Seat the table in three steps.</p><ol class="steps"><li><span class="n" aria-hidden="true">1</span><span><b>New Game</b><small>Open Setup and set the table.</small></span></li><li><span class="n" aria-hidden="true">2</span><span><b>Add Players</b><small>Seat 2 to 10 players.</small></span></li><li><span class="n" aria-hidden="true">3</span><span><b>Start Hand</b><small>Post the blinds and deal.</small></span></li></ol></div>';
 const alive=S.pl.filter(p=>p.stack>0);
 if(!S.pot&&!(S.q&&S.q.length)&&S.hand>1&&alive.length===1){$('bar').innerHTML='<p class="note">Winner: '+esc(alive[0].name)+'</p><button type="button" class="go" data-b="save"'+(S.rec?' disabled':'')+'>Save Result</button>';return}
 if(!c||c.fold){$('bar').innerHTML='<p class="note">'+(!n?'Add players to begin':S.pot?'Tap a player to act, or Award Pot at showdown':ready()?'Everyone seated? Start the hand.':'Need at least 2 players with chips')+'</p>'+(!S.pot&&ready()?'<button type="button" class="go" data-b="start">Start Hand · Blinds '+f(S.sb)+'/'+f(S.bb)+'</button>':'');return}
 const need=Math.max(0,t-c.bet),call=Math.min(need,c.stack);
 $('bar').innerHTML=`<div class="who-row"><b class="who">${esc(c.name)}</b><span class="hint">To call ${f(need)} · Stack ${f(c.stack)}</span></div>
<div class="row"><button type="button" class="fold" data-b="fold">Fold</button><button type="button" data-b="check">Check</button><button type="button" class="${call?'go':''}" data-b="call">Call${call?' '+f(call):''}</button><button type="button" class="hazard" data-b="allin">All-In</button></div>
<div class="row">${S.chips.map(v=>`<button type="button" class="${chipTone(v)}" data-v="${v}">+${f(v)}</button>`).join('')}<button type="button" data-v="0">Clear</button></div>
<div class="row"><button type="button" data-s="0.5">1/2 Pot</button><button type="button" data-s="1">Pot</button><button type="button" data-b="custom">Custom</button><button type="button" class="go" data-b="raise"${S.add?'':' disabled'}>${S.add?(t?'Raise To ':'Bet ')+f(t+S.add):'Pick '+(t?'a Raise':'a Bet')}</button></div>`;
}
draw();
matchMedia('(min-width:900px)').addEventListener('change',()=>draw());

/* PWA: manifest + icon are generated here so only sw.js is a separate file */
try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
 x.fillStyle='#0b3d2e';x.fillRect(0,0,180,180);x.fillStyle='#f5c542';x.beginPath();x.arc(90,90,62,0,7);x.fill();
 x.strokeStyle='#0b3d2e';x.lineWidth=10;x.beginPath();x.arc(90,90,46,0,7);x.stroke();
 x.fillStyle='#0b3d2e';x.beginPath();x.arc(90,90,16,0,7);x.fill();
 const u=c.toDataURL('image/png');$('ati').href=u;
 const tc=(document.getElementById('theme-color')||{}).content||'#10261f';
 const m={name:'Chip Tracker',short_name:'Chips',display:'standalone',background_color:tc,theme_color:tc,icons:[{src:u,sizes:'180x180',type:'image/png'}]};
 const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.append(l)}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
